<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | The Gifted Academy</title>
  <style>
    :root {
      --bg: #0a2150;
      --text: #ffffff;
      --muted: #b8c7ee;
      --accent: #f5c542;
      --primary: #2b7fff;
      --primary-hover: #4a92ff;
      --link: #3b8bff;
      --header-line: rgba(255, 255, 255, 0.1);
      --card-bg: linear-gradient(160deg, rgba(20, 70, 170, 0.35), rgba(10, 33, 80, 0.55));
      --card-border: rgba(130, 165, 255, 0.28);
      --card-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      --input-bg: rgba(6, 24, 66, 0.55);
      --input-border: rgba(140, 170, 255, 0.35);
      --placeholder: #8fa4d8;
      --icon: #c7d4f5;
      --divider: rgba(255, 255, 255, 0.22);
      --ghost-border: rgba(43, 127, 255, 0.55);
      --ghost-bg: rgba(6, 24, 66, 0.35);
    }

    [data-theme="light"] {
      --bg: #f4f7ff;
      --text: #0c2452;
      --muted: #3d507e;
      --link: #1a5fe0;
      --header-line: rgba(12, 36, 82, 0.12);
      --card-bg: #ffffff;
      --card-border: #dbe3f5;
      --card-shadow: 0 24px 60px rgba(12, 36, 82, 0.12);
      --input-bg: #ffffff;
      --input-border: #c5d0ea;
      --placeholder: #7a89ad;
      --icon: #4b5f8f;
      --divider: #ccd5ea;
      --ghost-border: #b5c4e6;
      --ghost-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color .3s, color .3s;
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: url("images/background.jpg") center top / cover no-repeat;
      z-index: 0;
      transition: opacity .3s;
    }
    [data-theme="light"] .bg { opacity: 0.12; }

    /* ---------- Header (same as landing page) ---------- */
    header {
      position: relative;
      z-index: 2;
      border-bottom: 1px solid var(--header-line);
    }
    .nav {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 1.15rem;
    }
    .brand img { height: 34px; width: auto; display: block; }

    .nav-right { display: flex; align-items: center; gap: 24px; }
    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.98rem;
      transition: color .2s;
    }
    .nav-link:hover { color: var(--text); }

    .nav-cta {
      padding: 9px 20px;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: background .2s;
    }
    .nav-cta:hover { background: var(--primary-hover); }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 0;
      cursor: pointer;
      color: var(--muted);
    }
    .theme-toggle .moon { font-size: 15px; line-height: 1; }
    .theme-toggle .track {
      width: 32px;
      height: 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.35);
      position: relative;
      transition: background .3s;
    }
    .theme-toggle .thumb {
      position: absolute;
      top: 3px;
      left: 4px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform .25s;
    }
    [data-theme="light"] .theme-toggle .track { background: rgba(12, 36, 82, 0.3); }
    [data-theme="light"] .theme-toggle .thumb { transform: translateX(10px); }

    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    /* ---------- Sign-in card ---------- */
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 20px 48px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 36px 38px 38px;
      border-radius: 18px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(6px);
    }
    .card h1 {
      text-align: center;
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.2;
    }
    .card .sub {
      text-align: center;
      margin-top: 6px;
      color: var(--muted);
      font-size: 1.05rem;
      font-weight: 500;
    }

    .field { margin-top: 22px; }
    .field-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    label { font-weight: 600; font-size: 1rem; }
    .forgot {
      color: var(--link);
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
    }
    .forgot:hover { text-decoration: underline; }

    .input {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 50px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      transition: border-color .2s, box-shadow .2s;
    }
    .input:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(43, 127, 255, 0.25);
    }
    .input svg { width: 20px; height: 20px; flex: none; stroke: var(--icon); }
    .input input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 1rem;
      outline: none;
    }
    .input input::placeholder { color: var(--placeholder); }
    .input input:focus-visible { outline: none; }
    .eye {
      display: grid;
      place-items: center;
      background: none;
      border: 0;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
    }
    .eye .off { display: none; }
    .eye.showing .on { display: none; }
    .eye.showing .off { display: block; }

    .remember {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      font-size: 1.02rem;
      cursor: pointer;
      width: fit-content;
    }
    .remember input {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1.5px solid var(--input-border);
      background: var(--input-bg);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .remember input:checked { background: var(--primary); border-color: var(--primary); }
    .remember input:checked::after {
      content: "";
      width: 6px;
      height: 11px;
      border: solid #fff;
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 52px;
      margin-top: 22px;
      border-radius: 14px;
      border: 1px solid transparent;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background .2s, transform .2s;
    }
    .btn svg { width: 20px; height: 20px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-primary svg { stroke: #fff; }
    .btn-ghost {
      margin-top: 0;
      background: var(--ghost-bg);
      border-color: var(--ghost-border);
      color: var(--text);
      font-weight: 600;
    }
    .btn-ghost:hover { border-color: var(--primary); }

    .or {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 22px 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--divider); }

    .error {
      display: none;
      margin-top: 14px;
      color: #ff8a8a;
      font-size: 0.95rem;
      text-align: center;
    }
    [data-theme="light"] .error { color: #c62828; }
    .error.show { display: block; }

    .switch {
      margin-top: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 1rem;
    }
    .switch a { color: var(--link); font-weight: 600; text-decoration: none; }
    .switch a:hover { text-decoration: underline; }

    .terms {
      margin-top: 28px;
      max-width: 400px;
      text-align: center;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.7;
    }
    .terms a { color: var(--muted); }
    .terms a:hover { color: var(--text); }

    @media (max-width: 520px) {
      main { padding-top: 36px; }
      .card { padding: 28px 22px 30px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header>
    <div class="nav">
      <a class="brand" href="index.html">
        <img src="images/logo.png" alt="">
        <span>The Gifted Academy</span>
      </a>

      <div class="nav-right">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-cta" href="signup.html">Sign up</a>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark and light theme">
          <span class="moon" aria-hidden="true">&#9790;</span>
          <span class="track"><span class="thumb"></span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="card">
      <h1>Sign in</h1>
      <p class="sub">Use your institution account</p>

      <!-- Point action at your PHP handler (e.g. login.php) -->
      <form id="loginForm" action="login.php" method="post" novalidate>
        <div class="field">
          <div class="field-head"><label for="email">Email</label></div>
          <div class="input">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
            </svg>
            <input id="email" name="email" type="email" placeholder="your@email.com" autocomplete="email" required>
          </div>
        </div>

        <div class="field">
          <div class="field-head">
            <label for="password">Password</label>
            <a class="forgot" href="#">Forgot Password?</a>
          </div>
          <div class="input">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
            </svg>
            <input id="password" name="password" type="password" placeholder="Enter Password" autocomplete="current-password" required>
            <button class="eye" id="eye" type="button" aria-label="Show password">
              <svg class="on" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="off" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
              </svg>
            </button>
          </div>
        </div>

        <label class="remember">
          <input type="checkbox" name="remember" value="1">
          <span>Remember me</span>
        </label>

        <p class="error" id="error" role="alert">Enter your email and password to continue.</p>

        <button class="btn btn-primary" type="submit">
          Sign In
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </button>
      </form>

      <div class="or">OR</div>

      <a class="btn btn-ghost" href="#" id="googleBtn">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/>
          <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
        </svg>
        Sign in with Google
      </a>

      <p class="switch">New here? <a href="signup.html">Create an account</a></p>
    </div>

    <p class="terms">
      By clicking continue, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </p>
  </main>

  <script>
    // Same theme setting as the landing page (shared via localStorage)
    const root = document.documentElement;
    const saved = localStorage.getItem("theme");
    if (saved) root.setAttribute("data-theme", saved);

    document.getElementById("themeToggle").addEventListener("click", () => {
      const next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
      root.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    });

    // Show / hide password
    const pw = document.getElementById("password");
    const eye = document.getElementById("eye");
    eye.addEventListener("click", () => {
      const show = pw.type === "password";
      pw.type = show ? "text" : "password";
      eye.classList.toggle("showing", show);
      eye.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });

    // Basic check before the form is sent to your PHP handler
    const form = document.getElementById("loginForm");
    const error = document.getElementById("error");
    form.addEventListener("submit", (e) => {
      const email = document.getElementById("email").value.trim();
      const ok = email && pw.value;
      error.classList.toggle("show", !ok);
      if (!ok) e.preventDefault();
    });

    // Hook your Google OAuth URL here
    document.getElementById("googleBtn").addEventListener("click", (e) => e.preventDefault());
  </script>
</body>
</html>
