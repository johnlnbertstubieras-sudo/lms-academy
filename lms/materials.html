<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materials | The Gifted Academy</title>
<style>
  :root {
    --bg: #0a2150; --text: #fff; --muted: #b8c7ee; --accent: #f5c542;
    --primary: #2b7fff; --primary-hover: #4a92ff;
    --side-bg: rgba(6, 24, 66, 0.72); --line: rgba(130, 165, 255, 0.18);
    --card-bg: linear-gradient(160deg, rgba(20, 70, 170, 0.35), rgba(10, 33, 80, 0.55));
    --card-border: rgba(130, 165, 255, 0.28); --card-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
    --row-bg: rgba(6, 24, 66, 0.35); --chip: rgba(255, 255, 255, 0.07);
    --icon: #c7d4f5; --stat-ico: #1a62e6; --field-bg: rgba(6, 24, 66, 0.55); --placeholder: #8fa4d8;
  }
  [data-theme="light"] {
    --bg: #f4f7ff; --text: #0c2452; --muted: #3d507e;
    --side-bg: #fff; --line: #dbe3f5; --card-bg: #fff; --card-border: #dbe3f5;
    --card-shadow: 0 16px 40px rgba(12, 36, 82, 0.1); --row-bg: #f7f9ff;
    --chip: #e9eefb; --icon: #4b5f8f; --field-bg: #fff; --placeholder: #7a89ad;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text); transition: background-color .3s, color .3s;
  }
  .bg { position: fixed; inset: 0; z-index: 0; background: url("images/background.jpg") center top / cover no-repeat; transition: opacity .3s; }
  [data-theme="light"] .bg { opacity: .12; }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  svg { stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Sidebar (same as other pages) */
  .side {
    position: fixed; inset: 0 auto 0 0; width: 290px; z-index: 5; padding: 24px 16px;
    background: var(--side-bg); border-right: 1px solid var(--line); backdrop-filter: blur(8px);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; padding: 0 8px 22px; }
  .brand img { height: 34px; }
  .group { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 16px 8px; }
  .side nav a {
    display: flex; align-items: center; gap: 16px; height: 42px; padding: 0 16px; margin-bottom: 4px;
    border-radius: 10px; font-size: 1rem; color: var(--text); transition: background .2s;
  }
  .side nav a svg { width: 22px; height: 22px; flex: none; }
  .side nav a:hover { background: var(--chip); }
  .side nav a.active { background: var(--primary); color: #fff; font-weight: 600; }
  .side hr { border: 0; border-top: 1px solid var(--line); margin: 16px 16px 4px; }

  /* Top bar (same as other pages) */
  .wrap { position: relative; z-index: 1; margin-left: 290px; flex: 1; min-width: 0; padding: 0 40px 48px; }
  .top { height: 76px; display: flex; align-items: center; justify-content: flex-end; gap: 22px; }
  .icon-btn { position: relative; background: none; border: 0; cursor: pointer; color: var(--icon); display: grid; place-items: center; }
  .icon-btn svg { width: 24px; height: 24px; }
  .badge { position: absolute; top: -6px; right: -7px; min-width: 16px; height: 16px; border-radius: 8px; background: #e5484d; color: #fff; font-size: .68rem; font-weight: 700; display: grid; place-items: center; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--primary); color: #fff; font-weight: 700; display: grid; place-items: center; }
  .theme-toggle { display: flex; align-items: center; gap: 6px; background: none; border: 0; cursor: pointer; color: var(--muted); }
  .theme-toggle .track { width: 32px; height: 20px; border-radius: 999px; background: rgba(255,255,255,.35); position: relative; transition: background .3s; }
  .theme-toggle .thumb { position: absolute; top: 3px; left: 4px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .25s; }
  [data-theme="light"] .theme-toggle .track { background: rgba(12,36,82,.3); }
  [data-theme="light"] .theme-toggle .thumb { transform: translateX(10px); }

  /* Greeting (same as dashboard) */
  .hello { color: var(--primary-hover); font-size: .95rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; margin-top: 8px; }
  h1 { font-size: 2.6rem; font-weight: 800; line-height: 1.2; }
  .tagline { color: var(--muted); margin: 6px 0 22px; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start; }
  .layout > * { min-width: 0; }
  .panel { border-radius: 16px; border: 1px solid var(--card-border); background: var(--card-bg); box-shadow: var(--card-shadow); }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .stat { display: flex; align-items: center; gap: 12px; padding: 16px; min-width: 0; }
  .stat .ico { width: 48px; height: 48px; border-radius: 50%; background: var(--stat-ico); color: #fff; display: grid; place-items: center; flex: none; }
  .stat .ico svg { width: 22px; height: 22px; }
  .stat > div:last-child { min-width: 0; }
  .stat span { font-size: .9rem; }
  .stat b { display: block; font-size: 1.7rem; line-height: 1.15; margin: 2px 0; }
  .stat small { display: block; color: var(--muted); font-size: .76rem; }

  /* Library */
  .library { margin-top: 22px; padding: 24px 26px; }
  .sec-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .sec-head h2 { font-size: 1.35rem; display: flex; align-items: center; gap: 12px; }
  .sec-head h2 svg { width: 26px; height: 26px; color: var(--icon); }
  .field { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; width: 260px; max-width: 100%; border-radius: 12px; border: 1px solid var(--card-border); background: var(--field-bg); }
  .field:focus-within { border-color: var(--primary-hover); }
  .field svg { width: 19px; height: 19px; color: var(--icon); flex: none; }
  .field input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: .92rem; }
  .field input::placeholder { color: var(--placeholder); }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs + .tabs { margin-top: 10px; }
  .tab { border: 0; cursor: pointer; padding: 8px 16px; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: .88rem; transition: background .2s; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { background: var(--primary); color: #fff; font-weight: 600; }
  .files { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 18px; }
  .file { display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 14px; background: var(--row-bg); border: 1px solid var(--line); transition: border-color .2s; }
  .file:hover { border-color: var(--card-border); }
  .f-top { display: flex; align-items: center; gap: 14px; }
  .tile { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; color: #fff; flex: none; }
  .tile svg { width: 27px; height: 27px; }
  .f-top div { min-width: 0; }
  .f-top small { display: block; color: var(--muted); font-size: .8rem; }
  .f-top strong { display: block; font-weight: 600; line-height: 1.3; margin: 2px 0; }
  .f-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-size: .8rem; }
  .tag { display: inline-block; padding: 3px 12px; border-radius: 999px; background: rgba(43, 127, 255, .28); color: var(--text); font-size: .76rem; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px; background: var(--primary); color: #fff; font-weight: 600; font-size: .9rem; transition: background .2s; }
  .btn:hover { background: var(--primary-hover); }
  .btn svg { width: 17px; height: 17px; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; font-size: .92rem; }

  /* Right column */
  .side-col { display: grid; gap: 22px; }
  .recent { padding: 22px 24px 14px; }
  .up-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
  .up-item .tile { width: 46px; height: 46px; border-radius: 12px; }
  .up-item .tile svg { width: 22px; height: 22px; }
  .up-item div:nth-child(2) { flex: 1; min-width: 0; }
  .up-item strong { display: block; font-weight: 600; }
  .up-item span { display: block; color: var(--muted); font-size: .85rem; margin-top: 3px; }
  .chev { width: 18px; height: 18px; color: var(--icon); flex: none; }
  .notice { padding: 24px; display: flex; gap: 18px; }
  .notice .ico { width: 62px; height: 62px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; flex: none; }
  .notice .ico svg { width: 28px; height: 28px; }
  .notice strong { display: block; font-size: 1.02rem; }
  .notice p { color: var(--muted); font-size: .92rem; line-height: 1.6; margin: 6px 0 16px; }
  .notice .btn { height: 44px; padding: 0 22px; font-size: 1rem; }

  /* Responsive */
  @media (max-width: 1560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 1250px) { .layout { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 1100px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 860px) {
    .side { position: static; width: 100%; height: auto; }
    body { flex-direction: column; } .wrap { margin-left: 0; padding: 0 20px 40px; }
    .side nav { display: flex; flex-wrap: wrap; } .group, .side hr { display: none; }
  }
  @media (max-width: 700px) { .stats { grid-template-columns: 1fr; } .field { width: 100%; } .files { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<aside class="side">
  <a class="brand" href="dashboard.html"><img src="images/logo.png" alt=""><span>The Gifted Academy</span></a>
  <nav id="nav" aria-label="Main"></nav>
</aside>

<div class="wrap">
  <div class="top">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark and light theme">
      <span aria-hidden="true">&#9790;</span><span class="track"><span class="thumb"></span></span>
    </button>
    <button class="icon-btn" type="button" aria-label="Notifications (3 unread)"><span data-i="bell"></span><span class="badge">3</span></button>
    <button class="icon-btn" type="button" aria-label="Messages"><span data-i="chat"></span></button>
    <div class="avatar" aria-label="Signed in as J">J</div>
  </div>

  <main>
    <p class="hello" id="greet">Good morning,</p>
    <h1>Welcome back!</h1>
    <p class="tagline">Keep learning, keep growing.</p>

    <div class="layout">
      <div>
        <section class="stats" id="stats" aria-label="Materials summary"></section>

        <section class="panel library">
          <div class="sec-head">
            <h2><span data-i="folder"></span>Materials</h2>
            <label class="field"><span data-i="search"></span><input id="q" type="search" placeholder="Search materials..." aria-label="Search materials" autocomplete="off"></label>
          </div>
          <div class="tabs" id="subjectTabs" role="tablist" aria-label="Subject"></div>
          <div class="tabs" id="typeTabs" role="tablist" aria-label="File type"></div>
          <div class="files" id="files"></div>
        </section>
      </div>

      <div class="side-col">
        <section class="panel recent">
          <div class="sec-head" style="margin-bottom:6px"><h2><span data-i="clock"></span>Recently Added</h2></div>
          <div id="recent"></div>
        </section>
        <section class="panel notice">
          <div class="ico" data-i="horn"></div>
          <div>
            <strong>Stay Updated</strong>
            <p>Check your messages for the latest announcements.</p>
            <a class="btn" href="announcements.html">View Messages <span data-i="arrow"></span></a>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>

<script>
// ---- Theme (shared) ----
const root = document.documentElement;
try { const s = localStorage.getItem("theme"); if (s) root.setAttribute("data-theme", s); } catch (e) {}
document.getElementById("themeToggle").addEventListener("click", () => {
  const next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("theme", next); } catch (e) {}
});

// ---- Icons ----
const P = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',
  cap: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/>',
  doc: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  chart: '<rect x="4" y="11" width="4" height="9"/><rect x="10" y="4" width="4" height="16"/><rect x="16" y="8" width="4" height="12"/>',
  folder: '<path d="M3 6h7l2 2h9v11H3z"/>',
  horn: '<path d="M3 10v4h4l9 5V5L7 10z"/><path d="M19 9a4 4 0 0 1 0 6"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8"/>',
  chev: '<path d="M9 5l7 7-7 7"/>', arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  download: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  video: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>'
};
const icon = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
document.querySelectorAll("[data-i]").forEach(el => el.innerHTML = icon(el.dataset.i));

// ---- Sidebar (same as other pages) ----
const NAV = [
  ["STUDENT"],
  ["dashboard.html", "home", "Dashboard"], ["calendar.html", "cal", "Calendar"],
  ["subjects.html", "cap", "Enrolled Subjects"], ["assessments.html", "doc", "Assessments"],
  ["scores.html", "chart", "My Scores"], ["hr"],
  ["RESOURCES"], ["materials.html", "folder", "Materials", true], ["announcements.html", "horn", "Announcements"]
];
document.getElementById("nav").innerHTML = NAV.map(n =>
  n[0] === "hr" ? "<hr>" :
  n.length === 1 ? `<p class="group">${n[0]}</p>` :
  `<a href="${n[0]}"${n[3] ? ' class="active" aria-current="page"' : ""}>${icon(n[1])}${n[2]}</a>`).join("");

// ---- Data: replace with fetch() to your PHP endpoints ----
const GRAD = {
  "Basic Numeracy": "linear-gradient(135deg,#2b9bff,#1a62e6)",
  "Physical Education": "linear-gradient(135deg,#2fd3a5,#10a37f)",
  "Social Skills": "linear-gradient(135deg,#a56bff,#6a3de8)",
  "Arts and Crafts": "linear-gradient(135deg,#ffb63d,#f28a1a)"
};
const TYPE = { PDF: ["doc", "Download"], Video: ["video", "Watch"], Worksheet: ["doc", "Download"], Link: ["link", "Open"] };
const MATERIALS = [
  { id: 1, title: "Counting 1 to 20 Worksheet", subject: "Basic Numeracy", type: "Worksheet", size: "240 KB", date: "2026-09-28", url: "#" },
  { id: 2, title: "Number Recognition Song", subject: "Basic Numeracy", type: "Video", size: "4 min", date: "2026-09-21", url: "#" },
  { id: 3, title: "Number Patterns Guide", subject: "Basic Numeracy", type: "PDF", size: "1.2 MB", date: "2026-09-14", url: "#" },
  { id: 4, title: "Obstacle Course Instructions", subject: "Physical Education", type: "PDF", size: "860 KB", date: "2026-09-26", url: "#" },
  { id: 5, title: "Warm-up Stretches", subject: "Physical Education", type: "Video", size: "6 min", date: "2026-09-17", url: "#" },
  { id: 6, title: "Greetings and Taking Turns", subject: "Social Skills", type: "PDF", size: "980 KB", date: "2026-09-25", url: "#" },
  { id: 7, title: "Feelings Chart", subject: "Social Skills", type: "Worksheet", size: "310 KB", date: "2026-09-12", url: "#" },
  { id: 8, title: "Paper Weaving Steps", subject: "Arts and Crafts", type: "PDF", size: "1.5 MB", date: "2026-09-22", url: "#" },
  { id: 9, title: "Color Mixing Practice", subject: "Arts and Crafts", type: "Link", size: "Website", date: "2026-09-10", url: "#" }
];

// ---- Helpers ----
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDate = iso => new Date(iso + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
$("greet").textContent = (h => h < 12 ? "Good morning," : h < 18 ? "Good afternoon," : "Good evening,")(new Date().getHours());

const sorted = [...MATERIALS].sort((a, b) => b.date.localeCompare(a.date));
const weekAgo = new Date(new Date(sorted[0].date + "T00:00:00").getTime() - 7 * 864e5).toISOString().slice(0, 10);

// ---- Stats ----
$("stats").innerHTML = [
  ["folder", "All Materials", MATERIALS.length, "Files and links"],
  ["doc", "Documents", MATERIALS.filter(m => m.type === "PDF" || m.type === "Worksheet").length, "PDFs and worksheets"],
  ["video", "Videos", MATERIALS.filter(m => m.type === "Video").length, "Watch and learn"],
  ["clock", "New This Week", MATERIALS.filter(m => m.date > weekAgo).length, "Recently added"]
].map(([ic, name, val, sub]) =>
  `<div class="panel stat"><div class="ico">${icon(ic)}</div><div><span>${name}</span><b>${val}</b><small>${sub}</small></div></div>`).join("");

// ---- Recently added ----
$("recent").innerHTML = sorted.slice(0, 3).map(m =>
  `<a class="up-item" href="${esc(m.url)}"><div class="tile" style="background:${GRAD[m.subject]}">${icon(TYPE[m.type][0])}</div>
    <div><strong>${esc(m.title)}</strong><span>${esc(m.subject)} &bull; ${fmtDate(m.date)}</span></div><span class="chev">${icon("chev")}</span></a>`).join("");

// ---- Library ----
const state = { subject: "all", type: "all", q: "" };
const tabs = (id, items, key) => {
  $(id).innerHTML = ["all", ...items].map(t =>
    `<button class="tab" type="button" role="tab" data-${key}="${esc(t)}" aria-selected="${state[key] === t}">${t === "all" ? (key === "subject" ? "All subjects" : "All types") : esc(t)}</button>`).join("");
};
const renderTabs = () => { tabs("subjectTabs", Object.keys(GRAD), "subject"); tabs("typeTabs", Object.keys(TYPE), "type"); };
function renderFiles() {
  const q = state.q.toLowerCase();
  const list = sorted.filter(m =>
    (state.subject === "all" || m.subject === state.subject) &&
    (state.type === "all" || m.type === state.type) &&
    (!q || (m.title + " " + m.subject).toLowerCase().includes(q)));
  $("files").innerHTML = list.length ? list.map(m => {
    const [ic, label] = TYPE[m.type];
    return `<article class="file">
      <div class="f-top"><div class="tile" style="background:${GRAD[m.subject]}">${icon(ic)}</div>
        <div><small>${esc(m.subject)}</small><strong>${esc(m.title)}</strong><span class="tag">${esc(m.type)}</span></div></div>
      <div class="f-meta"><span>${esc(m.size)}</span><span>${fmtDate(m.date)}</span></div>
      <a class="btn" href="${esc(m.url)}"${m.type === "Link" ? ' target="_blank" rel="noopener"' : ""}>${icon(m.type === "Link" ? "ext" : m.type === "Video" ? "video" : "download")}${label}</a></article>`;
  }).join("") : `<p class="empty">No materials found. Clear the search or pick another filter.</p>`;
}
$("subjectTabs").addEventListener("click", e => { const b = e.target.closest("[data-subject]"); if (!b) return; state.subject = b.dataset.subject; renderTabs(); renderFiles(); });
$("typeTabs").addEventListener("click", e => { const b = e.target.closest("[data-type]"); if (!b) return; state.type = b.dataset.type; renderTabs(); renderFiles(); });
$("q").addEventListener("input", e => { state.q = e.target.value.trim(); renderFiles(); });
renderTabs(); renderFiles();
</script>
</body>
</html>
