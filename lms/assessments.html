<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assessments | The Gifted Academy</title>
<style>
  :root {
    --bg: #0a2150; --text: #fff; --muted: #b8c7ee; --accent: #f5c542;
    --primary: #2b7fff; --primary-hover: #4a92ff;
    --side-bg: rgba(6, 24, 66, 0.72); --line: rgba(130, 165, 255, 0.18);
    --card-bg: linear-gradient(160deg, rgba(20, 70, 170, 0.35), rgba(10, 33, 80, 0.55));
    --card-border: rgba(130, 165, 255, 0.28); --card-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
    --row-bg: rgba(6, 24, 66, 0.35); --input-bg: rgba(6, 24, 66, 0.55);
    --chip: rgba(255, 255, 255, 0.07); --placeholder: #8fa4d8; --icon: #c7d4f5;
    --upcoming-bg: #b9852b; --open-bg: #14805f; --sub-bg: #1b5fd6;
  }
  [data-theme="light"] {
    --bg: #f4f7ff; --text: #0c2452; --muted: #3d507e;
    --side-bg: #fff; --line: #dbe3f5; --card-bg: #fff; --card-border: #dbe3f5;
    --card-shadow: 0 16px 40px rgba(12, 36, 82, 0.1); --row-bg: #f7f9ff; --input-bg: #fff;
    --chip: #e9eefb; --placeholder: #7a89ad; --icon: #4b5f8f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text); transition: background-color .3s, color .3s;
  }
  .bg { position: fixed; inset: 0; z-index: 0; background: url("images/background.jpg") center top / cover no-repeat; transition: opacity .3s; }
  [data-theme="light"] .bg { opacity: .12; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  svg { stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Sidebar */
  .side {
    position: fixed; inset: 0 auto 0 0; width: 290px; z-index: 5; padding: 24px 16px;
    background: var(--side-bg); border-right: 1px solid var(--line); backdrop-filter: blur(8px);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; padding: 0 8px 22px; }
  .brand img { height: 34px; }
  .group { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 16px 8px; }
  .side nav a {
    display: flex; align-items: center; gap: 16px; height: 42px; padding: 0 16px; margin-bottom: 4px;
    border-radius: 10px; font-size: 1rem; color: var(--text); transition: background .2s;
  }
  .side nav a svg { width: 22px; height: 22px; flex: none; }
  .side nav a:hover { background: var(--chip); }
  .side nav a.active { background: var(--primary); color: #fff; font-weight: 600; }
  .side hr { border: 0; border-top: 1px solid var(--line); margin: 16px 16px 4px; }

  /* Layout */
  .wrap { position: relative; z-index: 1; margin-left: 290px; flex: 1; min-width: 0; padding: 0 40px 48px; }
  .top { height: 76px; display: flex; align-items: center; justify-content: flex-end; gap: 22px; }
  .icon-btn { position: relative; background: none; border: 0; cursor: pointer; color: var(--icon); display: grid; place-items: center; }
  .icon-btn svg { width: 24px; height: 24px; }
  .badge { position: absolute; top: -6px; right: -7px; min-width: 16px; height: 16px; border-radius: 8px; background: #e5484d; color: #fff; font-size: .68rem; font-weight: 700; display: grid; place-items: center; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--primary); color: #fff; font-weight: 700; display: grid; place-items: center; }
  .theme-toggle { display: flex; align-items: center; gap: 6px; background: none; border: 0; cursor: pointer; color: var(--muted); }
  .theme-toggle .track { width: 32px; height: 20px; border-radius: 999px; background: rgba(255,255,255,.35); position: relative; transition: background .3s; }
  .theme-toggle .thumb { position: absolute; top: 3px; left: 4px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .25s; }
  [data-theme="light"] .theme-toggle .track { background: rgba(12,36,82,.3); }
  [data-theme="light"] .theme-toggle .thumb { transform: translateX(10px); }

  /* Header + filters */
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
  .head .kicker { color: var(--primary-hover); font-size: .95rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; margin-top: 8px; }
  h1 { font-size: 2.6rem; font-weight: 800; line-height: 1.2; }
  .tagline { color: var(--muted); margin: 6px 0 0; }
  .tools { display: flex; gap: 16px; flex-wrap: wrap; }
  .field { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--card-border); background: var(--input-bg); }
  .field:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(43,127,255,.25); }
  .field svg { width: 20px; height: 20px; flex: none; color: var(--icon); }
  .field input, .field select { border: 0; background: transparent; color: var(--text); font: inherit; font-size: .95rem; outline: none; height: 100%; }
  .field input { width: 240px; }
  .field select { min-width: 190px; cursor: pointer; }
  .field select option { color: #0c2452; }
  .field input::placeholder { color: var(--placeholder); }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 22px; }
  .stat { display: flex; align-items: center; gap: 18px; padding: 22px; border-radius: 16px; border: 1px solid var(--card-border); background: var(--card-bg); box-shadow: var(--card-shadow); }
  .stat .ico { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
  .stat .ico svg { width: 28px; height: 28px; }
  .stat b { display: block; font-size: 1.9rem; line-height: 1.1; margin: 2px 0; }
  .stat span { font-size: 1.02rem; }
  .stat small { display: block; color: var(--muted); font-size: .8rem; }

  /* List */
  .panel { margin-top: 24px; border-radius: 18px; border: 1px solid var(--card-border); background: var(--card-bg); box-shadow: var(--card-shadow); padding: 20px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { font-size: 1.2rem; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab { border: 0; cursor: pointer; padding: 9px 18px; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: .92rem; transition: background .2s; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { background: var(--primary); color: #fff; font-weight: 600; }

  .row {
    display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1.2fr) minmax(0, .8fr) 190px 20px;
    align-items: center; gap: 20px; padding: 16px; margin-top: 8px; border-radius: 14px; background: var(--row-bg);
    border: 1px solid transparent; transition: border-color .2s;
  }
  .row:hover { border-color: var(--card-border); }
  .subj { display: flex; align-items: center; gap: 18px; min-width: 0; }
  .subj .tile { width: 64px; height: 64px; border-radius: 14px; display: grid; place-items: center; color: #fff; flex: none; }
  .subj .tile svg { width: 30px; height: 30px; }
  .subj small { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .subj strong { display: block; font-weight: 600; font-size: 1.02rem; margin: 2px 0 6px; }
  .type { display: inline-block; padding: 2px 12px; border-radius: 6px; background: var(--chip); font-size: .78rem; }
  .meta { display: grid; grid-template-columns: 22px 1fr; gap: 6px 12px; font-size: .82rem; }
  .meta svg { width: 18px; height: 18px; color: var(--icon); grid-row: span 2; align-self: center; }
  .meta em { font-style: normal; color: var(--muted); font-size: .78rem; display: block; }
  .qs { display: flex; align-items: center; gap: 14px; }
  .qs svg { width: 30px; height: 30px; color: var(--icon); flex: none; }
  .qs b { display: block; font-size: 1rem; }
  .qs small { display: block; color: var(--muted); font-size: .78rem; line-height: 1.35; }
  .act { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .pill { padding: 3px 14px; border-radius: 999px; font-size: .78rem; font-weight: 600; color: #fff; }
  .pill.upcoming { background: var(--upcoming-bg); }
  .pill.open { background: var(--open-bg); }
  .pill.submitted { background: var(--sub-bg); }
  .pill.closed { background: #5b6b93; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--primary); font-size: .88rem; font-weight: 600; cursor: pointer; background: transparent; }
  .btn svg { width: 16px; height: 16px; }
  .btn.solid { background: var(--primary); color: #fff; }
  .btn.solid:hover { background: var(--primary-hover); }
  .btn.ghost:hover { background: var(--chip); }
  .chev { width: 18px; height: 18px; color: var(--icon); }
  .empty { text-align: center; padding: 56px 16px; color: var(--muted); }

  @media (max-width: 1200px) { .row { grid-template-columns: 1fr 1fr; } .chev { display: none; } .stats { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 860px) {
    .side { position: static; width: 100%; height: auto; }
    body { flex-direction: column; } .wrap { margin-left: 0; padding: 0 20px 40px; }
    .side nav { display: flex; flex-wrap: wrap; } .group, .side hr { display: none; }
  }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr; } .field input { width: 100%; } .tools, .field { width: 100%; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<aside class="side">
  <a class="brand" href="dashboard.html"><img src="images/logo.png" alt=""><span>The Gifted Academy</span></a>
  <nav id="nav" aria-label="Main"></nav>
</aside>

<div class="wrap">
  <div class="top">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark and light theme">
      <span aria-hidden="true">&#9790;</span><span class="track"><span class="thumb"></span></span>
    </button>
    <button class="icon-btn" type="button" aria-label="Notifications (3 unread)"><span data-i="bell"></span><span class="badge">3</span></button>
    <button class="icon-btn" type="button" aria-label="Messages"><span data-i="chat"></span></button>
    <div class="avatar" aria-label="Signed in as J">J</div>
  </div>

  <main>
    <div class="head">
      <div>
        <p class="kicker">Your assessments</p>
        <h1>Take your assessments</h1>
        <p>Complete your quizzes and exams on time. Check your status and keep track of your performance.</p>
      </div>
      <div class="tools">
        <label class="field"><span data-i="search"></span><input id="q" type="search" placeholder="Search assessments..." aria-label="Search assessments"></label>
        <label class="field"><span data-i="cap"></span>
          <select id="subject" aria-label="Filter by subject"><option value="">All subjects</option></select>
        </label>
      </div>
    </div>

    <section class="stats" id="stats" aria-label="Assessment summary"></section>

    <section class="panel">
      <div class="panel-head">
        <h2>All assessments</h2>
        <div class="tabs" id="tabs" role="tablist"></div>
      </div>
      <div id="list" role="list"></div>
    </section>
  </main>
</div>

<script>
// ---- Theme (shared with the other pages) ----
const root = document.documentElement;
try { const s = localStorage.getItem("theme"); if (s) root.setAttribute("data-theme", s); } catch (e) {}
document.getElementById("themeToggle").addEventListener("click", () => {
  const next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("theme", next); } catch (e) {}
});

// ---- Icons ----
const P = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',
  book: '<path d="M2 5c3-1 7-1 10 1 3-2 7-2 10-1v14c-3-1-7-1-10 1-3-2-7-2-10-1z"/><path d="M12 6v14"/>',
  doc: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  chart: '<rect x="4" y="11" width="4" height="9"/><rect x="10" y="4" width="4" height="16"/><rect x="16" y="8" width="4" height="12"/>',
  folder: '<path d="M3 6h7l2 2h9v11H3z"/>',
  horn: '<path d="M3 10v4h4l9 5V5L7 10z"/><path d="M19 9a4 4 0 0 1 0 6"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  cap: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
  play: '<path d="M7 5l12 7-12 7z" fill="currentColor"/>',
  eye: '<path d="M2 12s3.6-7 10 -7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  chev: '<path d="M9 5l7 7-7 7"/>',
  math: '<path d="M6 7h6M9 4v6M14 17h6M6 15l5 5M11 15l-5 5M15 7h5"/>',
  flask: '<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M8 15h8"/>'
};
const icon = (n, size) => `<svg viewBox="0 0 24 24" aria-hidden="true"${size ? ` width="${size}" height="${size}"` : ""}>${P[n]}</svg>`;
document.querySelectorAll("[data-i]").forEach(el => el.innerHTML = icon(el.dataset.i, el.closest(".field") ? 20 : 24));

// ---- Sidebar ----
const NAV = [
  ["STUDENT"],
  ["dashboard.html", "home", "Dashboard"], ["calendar.html", "cal", "Calendar"],
  ["subjects.html", "book", "Enrolled subjects"], ["assessments.html", "doc", "Assessments", true],
  ["scores.html", "chart", "My scores"], ["hr"],
  ["RESOURCES"], ["materials.html", "folder", "Materials"], ["announcements.html", "horn", "Announcements"]
];
document.getElementById("nav").innerHTML = NAV.map(n =>
  n[0] === "hr" ? "<hr>" :
  n.length === 1 ? `<p class="group">${n[0]}</p>` :
  `<a href="${n[0]}"${n[3] ? ' class="active" aria-current="page"' : ""}>${icon(n[1])}${n[2]}</a>`).join("");

// ---- Data: replace with a fetch() to your PHP endpoint (e.g. api/assessments.php) ----
const SUBJECT = {
  Mathematics: ["math", "linear-gradient(135deg,#9b5cff,#6a3de8)"],
  Science: ["book", "linear-gradient(135deg,#1fbf8f,#0f8f6b)"],
  English: ["doc", "linear-gradient(135deg,#5b7cff,#3b57e0)"],
  "Science-lab": ["flask", "linear-gradient(135deg,#ff7aa2,#f0517f)"]
};
const DATA = [
  { id: 1, subject: "Mathematics", title: "Algebraic Expressions Quiz", type: "Quiz", status: "upcoming", due: "Sep 18, 2026 • 10:00 AM", window: "Sep 18, 2026 • 9:00 AM – 10:00 AM", questions: 10, format: "Multiple Choice", tile: "Mathematics" },
  { id: 2, subject: "Science", title: "Earth and Life Science Assessment", type: "Quiz", status: "open", due: "Sep 20, 2026 • 11:00 AM", window: "Sep 20, 2026 • 10:00 AM – 11:00 AM", questions: 15, format: "Multiple Choice", tile: "Science" },
  { id: 3, subject: "English", title: "Reading Comprehension Quiz", type: "Quiz", status: "submitted", submitted: "Sep 15, 2026 • 2:45 PM", questions: 10, format: "Multiple Choice", tile: "English" },
  { id: 4, subject: "Science", title: "Lab Safety and Procedures", type: "Quiz", status: "upcoming", due: "Sep 22, 2026 • 1:00 PM", window: "Sep 22, 2026 • 12:00 PM – 1:00 PM", questions: 8, format: "True or False / Multiple Choice", tile: "Science-lab" }
];
const STATS = [
  ["upcoming", "Upcoming", "Due soon", "cal", "#0d55d6"],
  ["open", "Open", "Available now", "clock", "#6b45d6"],
  ["submitted", "Submitted", "Completed", "check", "#159a74"],
  ["closed", "Closed", "No longer available", "doc", "#4a5f9a"]
];
const LABEL = { upcoming: "Upcoming", open: "Open", submitted: "Submitted", closed: "Closed" };

// ---- State + render ----
const state = { tab: "all", q: "", subject: "" };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

$("subject").insertAdjacentHTML("beforeend", [...new Set(DATA.map(d => d.subject))].map(s => `<option>${s}</option>`).join(""));

function renderStats() {
  $("stats").innerHTML = STATS.map(([k, name, sub, ic, color]) =>
    `<div class="stat"><div class="ico" style="background:${color}">${icon(ic)}</div>
     <div><span>${name}</span><b>${DATA.filter(d => d.status === k).length}</b><small>${sub}</small></div></div>`).join("");
}

function renderTabs() {
  $("tabs").innerHTML = ["all", ...Object.keys(LABEL)].map(t =>
    `<button class="tab" role="tab" data-tab="${t}" aria-selected="${state.tab === t}">${t === "all" ? "All" : LABEL[t]}</button>`).join("");
}

function action(d) {
  const pill = `<span class="pill ${d.status}">${LABEL[d.status]}</span>`;
  if (d.status === "open") return pill + `<a class="btn solid" href="take-assessment.html?id=${d.id}">${icon("play")}Start assessment</a>`;
  if (d.status === "submitted") return pill + `<a class="btn ghost" href="result.html?id=${d.id}">${icon("eye")}View result</a>`;
  return pill;
}

function renderList() {
  const q = state.q.toLowerCase();
  const rows = DATA.filter(d =>
    (state.tab === "all" || d.status === state.tab) &&
    (!state.subject || d.subject === state.subject) &&
    (!q || (d.title + " " + d.subject).toLowerCase().includes(q)));
  if (!rows.length) { $("list").innerHTML = `<p class="empty">No assessments match your filters. Clear the search or pick another tab.</p>`; return; }
  $("list").innerHTML = rows.map(d => {
    const [ic, grad] = SUBJECT[d.tile];
    const when = d.status === "submitted"
      ? `<div class="meta">${icon("check")}<div><strong>Submitted</strong><em>${esc(d.submitted)}</em></div></div>`
      : `<div class="meta">${icon("cal")}<div><em>Due</em>${esc(d.due)}</div>${icon("clock")}<div><em>Available</em>${esc(d.window)}</div></div>`;
    return `<article class="row" role="listitem">
      <div class="subj"><div class="tile" style="background:${grad}">${icon(ic)}</div>
        <div><small>${esc(d.subject)}</small><strong>${esc(d.title)}</strong><span class="type">${esc(d.type)}</span></div></div>
      ${when}
      <div class="qs">${icon("doc")}<div><b>${d.questions}</b><small>Questions<br>${esc(d.format)}</small></div></div>
      <div class="act">${action(d)}</div>
      <span class="chev">${icon("chev")}</span></article>`;
  }).join("");
}

$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (!b) return; state.tab = b.dataset.tab; renderTabs(); renderList(); });
$("q").addEventListener("input", e => { state.q = e.target.value.trim(); renderList(); });
$("subject").addEventListener("change", e => { state.subject = e.target.value; renderList(); });

renderStats(); renderTabs(); renderList();
</script>
</body>
</html>
