<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar | The Gifted Academy</title>
<style>
  :root {
    --bg: #0a2150; --text: #fff; --muted: #b8c7ee; --accent: #f5c542;
    --primary: #2b7fff; --primary-hover: #4a92ff;
    --side-bg: rgba(6, 24, 66, 0.72); --line: rgba(130, 165, 255, 0.18);
    --card-bg: linear-gradient(160deg, rgba(20, 70, 170, 0.35), rgba(10, 33, 80, 0.55));
    --card-border: rgba(130, 165, 255, 0.28); --card-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
    --row-bg: rgba(6, 24, 66, 0.35); --chip: rgba(255, 255, 255, 0.07);
    --icon: #c7d4f5; --dim: rgba(184, 199, 238, 0.4); --today-bg: rgba(43, 127, 255, 0.28);
    --event: #c98a1c;
  }
  [data-theme="light"] {
    --bg: #f4f7ff; --text: #0c2452; --muted: #3d507e;
    --side-bg: #fff; --line: #dbe3f5; --card-bg: #fff; --card-border: #dbe3f5;
    --card-shadow: 0 16px 40px rgba(12, 36, 82, 0.1); --row-bg: #f7f9ff;
    --chip: #e9eefb; --icon: #4b5f8f; --dim: #a3b0cd; --today-bg: #dce9ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text); transition: background-color .3s, color .3s;
  }
  .bg { position: fixed; inset: 0; z-index: 0; background: url("images/background.jpg") center top / cover no-repeat; transition: opacity .3s; }
  [data-theme="light"] .bg { opacity: .12; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  svg { stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Sidebar (same as assessments) */
  .side {
    position: fixed; inset: 0 auto 0 0; width: 290px; z-index: 5; padding: 24px 16px;
    background: var(--side-bg); border-right: 1px solid var(--line); backdrop-filter: blur(8px);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; padding: 0 8px 22px; }
  .brand img { height: 34px; }
  .group { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 16px 8px; }
  .side nav a {
    display: flex; align-items: center; gap: 16px; height: 42px; padding: 0 16px; margin-bottom: 4px;
    border-radius: 10px; font-size: 1rem; color: var(--text); transition: background .2s;
  }
  .side nav a svg { width: 22px; height: 22px; flex: none; }
  .side nav a:hover { background: var(--chip); }
  .side nav a.active { background: var(--primary); color: #fff; font-weight: 600; }
  .side hr { border: 0; border-top: 1px solid var(--line); margin: 16px 16px 4px; }

  /* Top bar (same as assessments) */
  .wrap { position: relative; z-index: 1; margin-left: 290px; flex: 1; min-width: 0; padding: 0 40px 48px; }
  .top { height: 76px; display: flex; align-items: center; justify-content: flex-end; gap: 22px; }
  .icon-btn { position: relative; background: none; border: 0; cursor: pointer; color: var(--icon); display: grid; place-items: center; }
  .icon-btn svg { width: 24px; height: 24px; }
  .badge { position: absolute; top: -6px; right: -7px; min-width: 16px; height: 16px; border-radius: 8px; background: #e5484d; color: #fff; font-size: .68rem; font-weight: 700; display: grid; place-items: center; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--primary); color: #fff; font-weight: 700; display: grid; place-items: center; }
  .theme-toggle { display: flex; align-items: center; gap: 6px; background: none; border: 0; cursor: pointer; color: var(--muted); }
  .theme-toggle .track { width: 32px; height: 20px; border-radius: 999px; background: rgba(255,255,255,.35); position: relative; transition: background .3s; }
  .theme-toggle .thumb { position: absolute; top: 3px; left: 4px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .25s; }
  [data-theme="light"] .theme-toggle .track { background: rgba(12,36,82,.3); }
  [data-theme="light"] .theme-toggle .thumb { transform: translateX(10px); }

  /* Greeting */
  .hello { color: var(--primary-hover); font-size: .95rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; margin-top: 8px; }
  h1 { font-size: 2.6rem; font-weight: 800; line-height: 1.2; }
  .tagline { color: var(--muted); margin: 6px 0 22px; }

  .panel { border-radius: 18px; border: 1px solid var(--card-border); background: var(--card-bg); box-shadow: var(--card-shadow); padding: 20px; }

  /* Calendar toolbar */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .group-box { display: flex; gap: 8px; align-items: center; padding: 4px; border-radius: 10px; border: 1px solid var(--card-border); background: var(--row-bg); }
  .seg { height: 38px; padding: 0 20px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
  .seg:hover { color: var(--text); }
  .seg[aria-pressed="true"] { background: var(--primary); color: #fff; font-weight: 600; }
  .seg.arrow { width: 40px; padding: 0; display: grid; place-items: center; color: var(--text); }
  .seg.arrow svg { width: 20px; height: 20px; }
  .bar h2 { font-size: 1.7rem; font-weight: 700; text-align: center; flex: 1; min-width: 200px; }

  /* Month / week grid */
  .scroll { overflow-x: auto; }
  .grid { min-width: 640px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .dow { padding: 9px; text-align: center; font-size: .92rem; color: var(--muted); background: var(--row-bg); border-bottom: 1px solid var(--line); }
  .cell { min-height: 92px; padding: 8px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .cell:nth-child(7n + 8) { border-left: 0; }
  .grid.week .cell { min-height: 260px; }
  .num { display: block; text-align: right; font-size: .92rem; padding-bottom: 4px; }
  .cell.dim .num { color: var(--dim); }
  .cell.today { background: var(--today-bg); }
  .cell.today .num { color: var(--primary-hover); font-weight: 700; }
  .ev { display: block; width: 100%; text-align: left; border: 0; border-radius: 6px; background: var(--event); color: #fff; font-size: .8rem; font-weight: 600; padding: 3px 8px; margin-top: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev small { font-size: .68rem; font-weight: 500; opacity: .9; text-transform: uppercase; }
  .ev:hover { filter: brightness(1.1); }

  /* Day / list */
  .items { display: grid; gap: 8px; }
  .item { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 12px; background: var(--row-bg); border-left: 4px solid var(--event); }
  .item .d { width: 54px; text-align: center; flex: none; }
  .item .d b { display: block; font-size: 1.4rem; line-height: 1.1; }
  .item .d span { font-size: .75rem; color: var(--muted); text-transform: uppercase; }
  .item strong { display: block; font-weight: 600; }
  .item small, .none { color: var(--muted); font-size: .85rem; }
  .none { text-align: center; padding: 48px 12px; }

  /* Bottom cards */
  .two { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-top: 20px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .card-head h3 { display: flex; align-items: center; gap: 12px; font-size: 1.05rem; font-weight: 600; }
  .card-head h3 svg { width: 24px; height: 24px; color: var(--icon); }
  .card-head a { display: inline-flex; align-items: center; gap: 6px; color: var(--primary-hover); font-size: .92rem; }
  .card-head a svg { width: 16px; height: 16px; }
  .empty { text-align: center; padding: 14px 8px; }
  .empty .ic { width: 42px; height: 42px; margin: 0 auto 8px; border-radius: 10px; background: var(--chip); display: grid; place-items: center; color: var(--primary-hover); }
  .empty .ic svg { width: 24px; height: 24px; }
  .empty p { font-size: .95rem; }
  .empty small { color: var(--muted); }
  .subj { display: flex; align-items: center; gap: 14px; padding: 10px 12px; margin-top: 6px; border-radius: 12px; background: var(--row-bg); }
  .subj:hover { background: var(--chip); }
  .code { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 800; flex: none; }
  .subj div { flex: 1; min-width: 0; }
  .subj small { display: block; color: var(--muted); font-size: .78rem; }
  .subj > svg { width: 18px; height: 18px; color: var(--icon); }

  @media (max-width: 1000px) { .two { grid-template-columns: 1fr; } }
  @media (max-width: 860px) {
    .side { position: static; width: 100%; height: auto; }
    body { flex-direction: column; } .wrap { margin-left: 0; padding: 0 20px 40px; }
    .side nav { display: flex; flex-wrap: wrap; } .group, .side hr { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<aside class="side">
  <a class="brand" href="dashboard.html"><img src="images/logo.png" alt=""><span>The Gifted Academy</span></a>
  <nav id="nav" aria-label="Main"></nav>
</aside>

<div class="wrap">
  <div class="top">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark and light theme">
      <span aria-hidden="true">&#9790;</span><span class="track"><span class="thumb"></span></span>
    </button>
    <button class="icon-btn" type="button" aria-label="Notifications (3 unread)"><span data-i="bell"></span><span class="badge">3</span></button>
    <button class="icon-btn" type="button" aria-label="Messages"><span data-i="chat"></span></button>
    <div class="avatar" aria-label="Signed in as J">J</div>
  </div>

  <main>
    <p class="hello" id="greet">Good morning,</p>
    <h1>Welcome back!</h1>
    <p class="tagline">Keep learning, keep growing.</p>

    <section class="panel" aria-label="Calendar">
      <div class="bar">
        <div class="group-box">
          <button class="seg arrow" id="prev" type="button" aria-label="Previous"><span data-i="left"></span></button>
          <button class="seg arrow" id="next" type="button" aria-label="Next"><span data-i="chev"></span></button>
        </div>
        <div class="group-box"><button class="seg" id="today" type="button">Today</button></div>
        <h2 id="title" aria-live="polite"></h2>
        <div class="group-box" id="views"></div>
      </div>
      <div id="view"></div>
    </section>

    <div class="two">
      <section class="panel">
        <div class="card-head"><h3><span data-i="cal"></span>Upcoming activities</h3><a href="assessments.html">View all <span data-i="arrow"></span></a></div>
        <div id="upcoming"></div>
      </section>
      <section class="panel">
        <div class="card-head"><h3><span data-i="book"></span>Enrolled subjects</h3><a href="subjects.html">View all <span data-i="arrow"></span></a></div>
        <div id="subjects"></div>
      </section>
    </div>
  </main>
</div>

<script>
// ---- Theme (shared) ----
const root = document.documentElement;
try { const s = localStorage.getItem("theme"); if (s) root.setAttribute("data-theme", s); } catch (e) {}
document.getElementById("themeToggle").addEventListener("click", () => {
  const next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("theme", next); } catch (e) {}
});

// ---- Icons ----
const P = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',
  book: '<path d="M2 5c3-1 7-1 10 1 3-2 7-2 10-1v14c-3-1-7-1-10 1-3-2-7-2-10-1z"/><path d="M12 6v14"/>',
  cap: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/>',
  doc: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  chart: '<rect x="4" y="11" width="4" height="9"/><rect x="10" y="4" width="4" height="16"/><rect x="16" y="8" width="4" height="12"/>',
  folder: '<path d="M3 6h7l2 2h9v11H3z"/>',
  horn: '<path d="M3 10v4h4l9 5V5L7 10z"/><path d="M19 9a4 4 0 0 1 0 6"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8"/>',
  chev: '<path d="M9 5l7 7-7 7"/>', left: '<path d="M15 5l-7 7 7 7"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>'
};
const icon = (n, s) => `<svg viewBox="0 0 24 24" aria-hidden="true"${s ? ` width="${s}" height="${s}"` : ""}>${P[n]}</svg>`;
document.querySelectorAll("[data-i]").forEach(el => el.innerHTML = icon(el.dataset.i));

// ---- Sidebar (same as assessments) ----
const NAV = [
  ["STUDENT"],
  ["dashboard.html", "home", "Dashboard"], ["calendar.html", "cal", "Calendar", true],
  ["subjects.html", "cap", "Enrolled Subjects"], ["assessments.html", "doc", "Assessments"],
  ["scores.html", "chart", "My Scores"], ["hr"],
  ["RESOURCES"], ["materials.html", "folder", "Materials"], ["announcements.html", "horn", "Announcements"]
];
document.getElementById("nav").innerHTML = NAV.map(n =>
  n[0] === "hr" ? "<hr>" :
  n.length === 1 ? `<p class="group">${n[0]}</p>` :
  `<a href="${n[0]}"${n[3] ? ' class="active" aria-current="page"' : ""}>${icon(n[1])}${n[2]}</a>`).join("");

// ---- Data: replace with fetch() to your PHP endpoints ----
const EVENTS = [
  { id: 1, title: "Quiz 1", course: "INTEG 2", date: "2026-09-21", time: "9:00 AM" },
  { id: 2, title: "Quiz 2", course: "INTEG 2", date: "2026-09-21", time: "10:00 AM" },
  { id: 3, title: "Quiz 3", course: "INTEG 2", date: "2026-09-21", time: "11:00 AM" }
];
const SUBJECTS = [
  { code: "CC", name: "Computer Science", meta: "IT306 — INTEG 2", color: "#2b7fff" },
  { code: "MA", name: "Mathematics", meta: "BSIT3A1", color: "#8b3dff" }
];

// ---- Helpers ----
const $ = id => document.getElementById(id);
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const fmt = (d, o) => d.toLocaleDateString("en-US", o);
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const now = new Date(), todayIso = iso(now);
const state = { view: "month", cursor: new Date(now.getFullYear(), now.getMonth(), now.getDate()) };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const evOn = k => EVENTS.filter(e => e.date === k);
const chip = e => `<a class="ev" href="assessments.html" title="${esc(e.title)} ${esc(e.course)} · ${esc(e.time)}">● ${esc(e.title)} <small>${esc(e.course)}</small></a>`;

$("greet").textContent = (h => h < 12 ? "Good morning," : h < 18 ? "Good afternoon," : "Good evening,")(now.getHours());

// ---- Views ----
function cells(start, count, monthIdx) {
  return Array.from({ length: count }, (_, i) => {
    const d = addDays(start, i), k = iso(d);
    const cls = ["cell", k === todayIso ? "today" : "", monthIdx !== null && d.getMonth() !== monthIdx ? "dim" : ""].join(" ");
    return `<div class="${cls}"><span class="num">${d.getDate()}</span>${evOn(k).map(chip).join("")}</div>`;
  }).join("");
}
function gridHtml(start, count, monthIdx) {
  return `<div class="scroll"><div class="grid ${count === 7 ? "week" : ""}">${DOW.map(d => `<div class="dow">${d}</div>`).join("")}${cells(start, count, monthIdx)}</div></div>`;
}
function itemHtml(e) {
  const d = new Date(e.date + "T00:00:00");
  return `<a class="item" href="assessments.html"><div class="d"><b>${d.getDate()}</b><span>${fmt(d, { month: "short" })}</span></div>
    <div><strong>${esc(e.title)}</strong><small>${esc(e.course)} · ${esc(e.time)}</small></div></a>`;
}
const itemsHtml = (list, msg) => list.length ? `<div class="items">${list.map(itemHtml).join("")}</div>` : `<p class="none">${msg}</p>`;

function render() {
  const c = state.cursor;
  document.querySelectorAll("#views .seg").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.view));
  if (state.view === "month") {
    const first = new Date(c.getFullYear(), c.getMonth(), 1);
    const start = addDays(first, -first.getDay());
    const days = new Date(c.getFullYear(), c.getMonth() + 1, 0).getDate();
    const rows = Math.ceil((first.getDay() + days) / 7);
    $("title").textContent = fmt(c, { month: "long", year: "numeric" });
    $("view").innerHTML = gridHtml(start, rows * 7, c.getMonth());
  } else if (state.view === "week") {
    const start = addDays(c, -c.getDay()), end = addDays(start, 6);
    $("title").textContent = `${fmt(start, { month: "short", day: "numeric" })} – ${fmt(end, { month: "short", day: "numeric", year: "numeric" })}`;
    $("view").innerHTML = gridHtml(start, 7, null);
  } else if (state.view === "day") {
    $("title").textContent = fmt(c, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
    $("view").innerHTML = itemsHtml(evOn(iso(c)), "Nothing scheduled for this day.");
  } else {
    $("title").textContent = fmt(c, { month: "long", year: "numeric" });
    const list = EVENTS.filter(e => e.date.slice(0, 7) === iso(c).slice(0, 7)).sort((a, b) => a.date.localeCompare(b.date));
    $("view").innerHTML = itemsHtml(list, "No activities this month.");
  }
}
function step(dir) {
  const c = state.cursor;
  if (state.view === "month" || state.view === "list") state.cursor = new Date(c.getFullYear(), c.getMonth() + dir, 1);
  else state.cursor = addDays(c, dir * (state.view === "week" ? 7 : 1));
  render();
}

$("views").innerHTML = [["month", "Month"], ["week", "Week"], ["day", "Day"], ["list", "List"]]
  .map(([v, l]) => `<button class="seg" type="button" data-v="${v}">${l}</button>`).join("");
$("views").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) { state.view = b.dataset.v; render(); } });
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
$("today").addEventListener("click", () => { state.cursor = new Date(now.getFullYear(), now.getMonth(), now.getDate()); render(); });

// ---- Bottom cards ----
const upcoming = EVENTS.filter(e => e.date >= todayIso).sort((a, b) => a.date.localeCompare(b.date));
$("upcoming").innerHTML = upcoming.length ? `<div class="items">${upcoming.slice(0, 4).map(itemHtml).join("")}</div>` :
  `<div class="empty"><div class="ic">${icon("cal")}</div><p>No upcoming activities</p><small>You're all caught up!</small></div>`;
$("subjects").innerHTML = SUBJECTS.map(s =>
  `<a class="subj" href="subjects.html"><span class="code" style="background:${s.color}">${s.code}</span>
   <div><strong>${esc(s.name)}</strong><small>${esc(s.meta)}</small></div>${icon("chev")}</a>`).join("");

render();
</script>
</body>
</html>
