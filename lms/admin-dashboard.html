<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gifted Academy – Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fd;--card:#fff;--ink:#0f1f4b;--mut:#5b6787;--line:#e6ebf6;--blue:#2f6df6;--blue2:#e3ecff;--green:#0f7a55;--gbg:#d9f4e8;--red:#d93a3a;--rbg:#fde4e4;--amb:#b45f06;--abg:#fdf0d5;--shadow:0 4px 18px rgba(30,60,140,.07)}
:root[data-theme=dark]{--bg:#0d1430;--card:#141d40;--ink:#eaf0ff;--mut:#9aa8d0;--line:#243060;--blue2:#1f2f68;--gbg:#123a30;--rbg:#4a1f27;--abg:#4a3a14;--shadow:none}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;font-size:14px}
button,input,select{font:inherit;color:inherit}
aside{width:290px;background:var(--card);border-right:1px solid var(--line);padding:28px 16px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{font-weight:800;font-size:19px;padding:0 16px 26px}
.sec{font-size:12px;letter-spacing:.08em;color:var(--mut);padding:8px 16px;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;border:0;background:none;border-radius:12px;cursor:pointer;text-align:left;font-weight:500;color:var(--ink)}
.nav:hover{background:var(--blue2)}
.nav.on{background:var(--blue);color:#fff;font-weight:700}
.nav svg{width:20px;height:20px;flex-shrink:0}
hr{border:0;border-top:1px solid var(--line);margin:14px 16px}
main{flex:1;min-width:0;padding:22px 40px 50px;overflow:auto}
.top{display:flex;justify-content:flex-end;align-items:center;gap:22px;height:44px}
.tg{width:32px;height:18px;border-radius:9px;background:#b9c3dc;position:relative;cursor:pointer;border:0}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
[data-theme=dark] .tg{background:var(--blue)}[data-theme=dark] .tg::after{left:16px}
.av{width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}
.hi{font-size:13px;letter-spacing:.14em;color:var(--blue);font-weight:600;margin-top:12px}
h1{font-size:38px;font-weight:800;margin:4px 0 6px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 24px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:2fr 1fr;align-items:start;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.stat{display:flex;align-items:center;gap:14px;padding:16px 18px}
.ic{width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex-shrink:0}
.ic svg{width:22px;height:22px}
.stat b{font-size:26px;display:block;line-height:1.1}
.stat span{font-size:12px;color:var(--mut)}
h2{font-size:20px;font-weight:700;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
h2 a,.link{font-size:13px;color:var(--blue);font-weight:600;cursor:pointer;background:none;border:0}
.row{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .g{flex:1;min-width:0}.row b{display:block;font-weight:700}.row small{color:var(--mut)}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.p-g{background:var(--gbg);color:var(--green)}.p-r{background:var(--rbg);color:var(--red)}.p-b{background:var(--blue2);color:var(--blue)}.p-a{background:var(--abg);color:var(--amb)}
.date{width:46px;height:46px;border-radius:12px;background:var(--blue2);display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.1;flex-shrink:0}
.date b{font-size:18px}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar input,.bar select,.field{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.bar input{flex:1;min-width:180px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer}
.btn.alt{background:var(--blue2);color:var(--blue)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px 10px}
td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}
.who{display:flex;align-items:center;gap:10px}.who .av{width:34px;height:34px;font-size:13px}
.sw{width:38px;height:22px;border-radius:11px;background:#b9c3dc;border:0;position:relative;cursor:pointer;flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--green)}.sw.on::after{left:19px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.cc .ic{border-radius:14px;width:52px;height:52px;margin-bottom:12px}
.meter{height:9px;border-radius:5px;background:var(--blue2);overflow:hidden;margin:6px 0 14px}.meter i{display:block;height:100%;background:var(--blue);border-radius:5px}
.qa{display:grid;gap:10px}.qa .btn{text-align:left}
dialog{border:0;border-radius:18px;padding:24px;background:var(--card);color:var(--ink);width:min(420px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,50,.5)}
dialog label{display:block;font-weight:600;margin:12px 0 4px}dialog .field{width:100%}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;flex-direction:row;overflow-x:auto;padding:10px;border:0}.brand,.sec,hr{display:none}.nav{width:auto;white-space:nowrap}main{padding:16px}h1{font-size:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside id="side"></aside>
<main>
  <div class="top">
    <button class="tg" id="theme" aria-label="Toggle dark mode"></button>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    <div class="av">A</div>
  </div>
  <div id="view"></div>
</main>
<dialog id="dlg">
  <form method="dialog" id="uf">
    <h2>Add user</h2>
    <label for="un">Full name</label><input class="field" id="un" required>
    <label for="ue">Email</label><input class="field" id="ue" type="email" required>
    <label for="ur">Role</label><select class="field" id="ur"><option>Student</option><option>Instructor</option><option>Admin</option></select>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px">
      <button class="btn alt" value="cancel" formnovalidate>Cancel</button><button class="btn" id="save" value="ok">Create account</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const P={
 home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.5.6 4 2.5 4 6"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
 cap:'<path d="M2 9l10-5 10 5-10 5zM6 11v5c0 1.5 3 3 6 3s6-1.500 6-3v-5"/>',
 book:'<path d="M3 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H3zM21 5h-7a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h7z"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'
};
const I=(k)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[k]}</svg>`;

let users=[
 {n:'Admin Rivera',e:'admin@giftedacademy.edu',r:'Admin',a:1},
 {n:'Carla Santos',e:'carla.santos@giftedacademy.edu',r:'Instructor',a:1},
 {n:'Luis Reyes',e:'luis.reyes@giftedacademy.edu',r:'Instructor',a:1},
 {n:'Dana Cruz',e:'dana.cruz@giftedacademy.edu',r:'Instructor',a:1},
 {n:'Angela Ramos',e:'angela.ramos@giftedacademy.edu',r:'Instructor',a:1},
 ...['Juan Dela Cruz','Maria Lopez','Paolo Garcia','Bea Mendoza','Carlo Tan','Lia Navarro','Miguel Aquino','Sofia Bautista','Rafael Cruz','Isabel Torres','Noah Villanueva','Ella Domingo'].map((n,i)=>({n,e:n.toLowerCase().replace(/ /g,'.')+'@student.giftedacademy.edu',r:'Student',a:i===10?0:1}))
];
let courses=[
 {n:'Basic Numeracy',c:'INTG2',i:'Carla Santos',s:12,k:'chart',col:'linear-gradient(135deg,#3b82f6,#1d5fe0)',on:1,sch:'Mon & Wed • 9:00 – 10:00 AM'},
 {n:'Physical Education',c:'INTG2',i:'Luis Reyes',s:12,k:'shield',col:'linear-gradient(135deg,#2dd4a3,#0f9e78)',on:1,sch:'Tue & Thu • 10:30 – 11:30 AM'},
 {n:'Social Skills',c:'INTG2',i:'Dana Cruz',s:12,k:'users',col:'linear-gradient(135deg,#a879f6,#7c3aed)',on:1,sch:'Mon & Fri • 1:00 – 2:00 PM'},
 {n:'Arts and Crafts',c:'INTG2',i:'Angela Ramos',s:12,k:'book',col:'linear-gradient(135deg,#fbb03b,#f28a0d)',on:1,sch:'Wed & Fri • 2:30 – 3:30 PM'}
];
let log=[
 ['Account created','Noah Villanueva was added as a student','Today'],
 ['Account deactivated','Noah Villanueva was deactivated','Today'],
 ['Role changed','Dana Cruz was set to Instructor','Yesterday'],
 ['Course assigned','Basic Numeracy assigned to Carla Santos','Sep 27']
];
const perms={
 Admin:['Manage all user accounts','Assign and change roles','Activate or deactivate accounts','Manage courses and instructors','View system-wide information'],
 Instructor:['Manage assigned classes','Create assessments','Grade submissions','Post announcements'],
 Student:['View enrolled subjects','Take assessments','View own scores','Read announcements']
};
let page='dash',q='',rf='All';

const nav=[['dash','home','Dashboard'],['users','users','User Accounts'],['roles','shield','Roles'],['ins','cap','Instructors'],['stu','user','Students'],['crs','book','Courses'],['sys','chart','System Overview']];
function side(){
 $('#side').innerHTML='<div class="brand">The Gifted Academy</div><div class="sec">Administrator</div>'+
 nav.map(([id,ic,l])=>`<button class="nav ${id===page?'on':''}" data-p="${id}">${I(ic)}${l}</button>`).join('')+
 '<hr><div class="sec">System</div><button class="nav" data-p="sys">'+I('chart')+'Activity log</button>';
}
const ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('');
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)};
const sw=(i)=>`<button class="sw ${users[i].a?'on':''}" data-t="${i}" role="switch" aria-checked="${!!users[i].a}" aria-label="Active"></button>`;
const head=(t,s)=>`<div class="hi">GOOD MORNING,</div><h1>${t}</h1><p class="sub">${s}</p>`;
const cnt=r=>users.filter(u=>u.r===r).length;
const stat=(k,n,l,s)=>`<div class="card stat"><div class="ic">${I(k)}</div><div><span>${l}</span><b>${n}</b><span>${s}</span></div></div>`;

function pill(u){return u.a?'<span class="pill p-g">Active</span>':'<span class="pill p-r">Inactive</span>'}

function userTable(list){
 return `<div class="tw"><table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Active</th></tr></thead><tbody>`+
 list.map(u=>{const i=users.indexOf(u);return `<tr><td><div class="who"><div class="av">${ini(u.n)}</div><div><b>${u.n}</b><br><small style="color:var(--mut)">${u.e}</small></div></div></td>
 <td><select class="field" data-r="${i}" aria-label="Role for ${u.n}">${['Admin','Instructor','Student'].map(r=>`<option ${r===u.r?'selected':''}>${r}</option>`).join('')}</select></td>
 <td>${pill(u)}</td><td>${sw(i)}</td></tr>`}).join('')+`</tbody></table></div>`;
}

const V={
 dash(){
  const off=users.filter(u=>!u.a);
  return head('Welcome back, Admin!','Here\'s what\'s happening across the academy today.')+
  `<div class="grid g4">${stat('users',users.length,'Total Users',users.filter(u=>u.a).length+' active')}${stat('cap',cnt('Instructor'),'Instructors','Teaching')}${stat('user',cnt('Student'),'Students','Enrolled')}${stat('book',courses.filter(c=>c.on).length,'Courses','Active')}</div>
  <div class="grid g2"><div class="card"><h2>Courses <a data-p="crs" class="link">View all</a></h2>${courses.map(c=>`<div class="row"><div class="ic" style="border-radius:12px;background:${c.col}">${I(c.k)}</div><div class="g"><b>${c.n}</b><small>${c.i} • ${c.s} students</small></div><small>${c.sch}</small></div>`).join('')}</div>
  <div class="grid"><div class="card"><h2>Needs attention</h2>${off.length?off.map(u=>`<div class="row"><div class="date"><b>!</b></div><div class="g"><b>${u.n}</b><small>${u.r} • Inactive</small></div><button class="btn alt" data-t="${users.indexOf(u)}">Activate</button></div>`).join(''):'<p class="sub" style="margin:0">All accounts are active.</p>'}</div>
  <div class="card"><h2>Quick actions</h2><div class="qa"><button class="btn" id="add1">Add a user</button><button class="btn alt" data-p="roles">Review roles</button><button class="btn alt" data-p="sys">Open activity log</button></div></div></div></div>`;
 },
 users(){
  const l=users.filter(u=>(rf==='All'||u.r===rf)&&(u.n+u.e).toLowerCase().includes(q));
  return head('User Accounts','Create accounts, change roles, and activate or deactivate access.')+
  `<div class="card"><div class="bar"><input id="q" placeholder="Search by name or email" value="${q}" aria-label="Search users"><select class="field" id="rf" aria-label="Filter by role">${['All','Admin','Instructor','Student'].map(r=>`<option ${r===rf?'selected':''}>${r}</option>`).join('')}</select><button class="btn" id="add">Add user</button></div>${l.length?userTable(l):'<p class="sub">No users match. Try a different name or role.</p>'}</div>`;
 },
 roles(){
  return head('Roles','What each role can do in the LMS.')+`<div class="cards">`+Object.keys(perms).map(r=>`<div class="card"><h2>${r} <span class="pill p-b">${cnt(r)} users</span></h2>${perms[r].map(p=>`<div class="row" style="padding:9px 0"><span style="color:var(--green)">✓</span><div class="g">${p}</div></div>`).join('')}<button class="btn alt" style="margin-top:12px" data-f="${r}">View ${r.toLowerCase()}s</button></div>`).join('')+`</div>`;
 },
 ins(){
  return head('Instructors','Manage instructor accounts and their course assignments.')+`<div class="cards">`+users.map((u,i)=>[u,i]).filter(([u])=>u.r==='Instructor').map(([u,i])=>{const cs=courses.filter(c=>c.i===u.n);return `<div class="card"><div class="who" style="margin-bottom:12px"><div class="av">${ini(u.n)}</div><div class="g"><b>${u.n}</b><br><small style="color:var(--mut)">${u.e}</small></div>${sw(i)}</div>${pill(u)}<p style="color:var(--mut);margin:12px 0 4px">Assigned courses</p>${cs.length?cs.map(c=>`<b>${c.n}</b> <small>${c.c}</small><br>`).join(''):'<small>None yet. Assign one from Courses.</small>'}</div>`}).join('')+`</div>`;
 },
 stu(){
  const l=users.filter(u=>u.r==='Student'&&u.n.toLowerCase().includes(q));
  return head('Students','View and manage every enrolled student.')+`<div class="card"><div class="bar"><input id="q" placeholder="Search students" value="${q}" aria-label="Search students"><button class="btn" id="add">Add student</button></div><div class="tw"><table><thead><tr><th>Name</th><th>Courses</th><th>Status</th><th>Active</th></tr></thead><tbody>${l.map(u=>`<tr><td><div class="who"><div class="av">${ini(u.n)}</div><b>${u.n}</b></div></td><td>${u.a?courses.filter(c=>c.on).length:0} enrolled</td><td>${pill(u)}</td><td>${sw(users.indexOf(u))}</td></tr>`).join('')}</tbody></table></div></div>`;
 },
 crs(){
  const ins=users.filter(u=>u.r==='Instructor'&&u.a);
  return head('Courses','Assign instructors and control which courses are open.')+`<div class="cards">`+courses.map((c,i)=>`<div class="card cc"><div class="ic" style="background:${c.col}">${I(c.k)}</div><h2 style="margin-bottom:2px">${c.n}</h2><small style="color:var(--mut)">${c.c} • ${c.s} students</small><p style="margin:10px 0"><small>${c.sch}</small></p><label for="ci${i}"><small>Instructor</small></label><select class="field" style="width:100%;margin:4px 0 14px" id="ci${i}" data-c="${i}">${ins.map(u=>`<option ${u.n===c.i?'selected':''}>${u.n}</option>`).join('')}</select><div style="display:flex;justify-content:space-between;align-items:center"><span class="pill ${c.on?'p-g':'p-a'}">${c.on?'Open':'Closed'}</span><button class="btn alt" data-x="${i}">${c.on?'Close course':'Reopen course'}</button></div></div>`).join('')+`</div>`;
 },
 sys(){
  const t=users.length,bar=(l,n)=>`<b>${l}</b> <small>${n}</small><div class="meter"><i style="width:${n/t*100}%"></i></div>`;
  return head('System Overview','Academy-wide numbers and recent account activity.')+
  `<div class="grid g4">${stat('users',t,'Accounts','All roles')}${stat('shield',users.filter(u=>u.a).length,'Active','Can sign in')}${stat('book',courses.length,'Courses','Total')}${stat('chart','92%','Average grade','All classes')}</div>
  <div class="grid g2"><div class="card"><h2>Recent activity</h2>${log.map(([a,d,w])=>`<div class="row"><div class="g"><b>${a}</b><small>${d}</small></div><small>${w}</small></div>`).join('')}</div>
  <div class="card"><h2>Users by role</h2>${bar('Students',cnt('Student'))}${bar('Instructors',cnt('Instructor'))}${bar('Admins',cnt('Admin'))}</div></div>`;
 }
};

function render(){side();$('#view').innerHTML=V[page]();}
function go(p){page=p;q='';if(p!=='users')rf='All';render()}
function act(a,d){log.unshift([a,d,'Just now']);log=log.slice(0,8)}

document.addEventListener('click',e=>{
 const p=e.target.closest('[data-p]');if(p)return go(p.dataset.p);
 const f=e.target.closest('[data-f]');if(f){rf=f.dataset.f;page='users';q='';return render()}
 const t=e.target.closest('[data-t]');if(t){const u=users[+t.dataset.t];u.a=u.a?0:1;act(u.a?'Account activated':'Account deactivated',u.n+(u.a?' was activated':' was deactivated'));toast(u.n+(u.a?' activated':' deactivated'));return render()}
 const x=e.target.closest('[data-x]');if(x){const c=courses[+x.dataset.x];c.on=c.on?0:1;act(c.on?'Course reopened':'Course closed',c.n);toast(c.n+(c.on?' reopened':' closed'));return render()}
 if(e.target.id==='add'||e.target.id==='add1')$('#dlg').showModal();
});
document.addEventListener('change',e=>{
 const r=e.target.dataset.r;if(r!==undefined){const u=users[+r];u.r=e.target.value;act('Role changed',u.n+' was set to '+u.r);toast(u.n+' is now '+u.r);return render()}
 const c=e.target.dataset.c;if(c!==undefined){courses[+c].i=e.target.value;act('Course assigned',courses[+c].n+' assigned to '+e.target.value);toast('Instructor updated');render()}
 if(e.target.id==='rf'){rf=e.target.value;render()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value.toLowerCase();const pos=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}});
$('#uf').addEventListener('submit',e=>{
 if(e.submitter&&e.submitter.value==='cancel')return;
 const n=$('#un').value.trim(),m=$('#ue').value.trim(),r=$('#ur').value;
 users.push({n,e:m,r,a:1});act('Account created',n+' was added as '+r.toLowerCase());toast('Account created for '+n);$('#uf').reset();render();
});
$('#theme').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'':'dark'};
render();
</script>
</body>
</html>
